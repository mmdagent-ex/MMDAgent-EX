name: macOS Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: macOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew update
          # Install dependencies except poco
          grep -v '^poco$' requirements-mac.txt > req-mac-no-poco.txt
          brew install $(cat req-mac-no-poco.txt) pcre2

      - name: Build and install Poco 1.12.4
        run: |
          mkdir Library_Poco && cd Library_Poco
          curl -L -o poco-1.12.4-all.zip https://pocoproject.org/releases/poco-1.12.4/poco-1.12.4-all.zip
          unzip -q poco-1.12.4-all.zip 
          cd poco-1.12.4-all
          mkdir cmake-build && cd cmake-build
          cmake .. -DPOCO_UNBUNDLED=ON
          make -s -j$(sysctl -n hw.ncpu)
          sudo make install

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 3

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-result-macos
          path: |
            Release/MMDAgent-EX
            Release/Plugins/*.so
          if-no-files-found: error
          retention-days: 60
